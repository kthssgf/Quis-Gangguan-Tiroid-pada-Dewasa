<script>
const Q=[
{t:"C1-C2",s:"Pada hipertiroidisme primer, hasil laboratorium yang paling khas adalah...",o:["fT4/TT4 tinggi dengan TSH tersupresi (kurang dari 0,1 uU/L)","T4 rendah dengan TSH tinggi","TSH tinggi dengan T4 normal","T4 dan TSH sama-sama rendah","TSH dan T4 normal"],w:["T4 rendah dengan TSH tinggi adalah pola hipotiroidisme primer.","TSH tinggi dengan T4 normal adalah pola hipotiroid subklinis.","T4 dan TSH sama-sama rendah adalah pola hipotiroid sekunder atau sentral, bukan hipertiroid primer.","TSH dan T4 normal tidak menunjukkan gangguan tiroid."],e:"Hipertiroidisme primer ditandai peningkatan hormon tiroid bebas (fT4 atau TT4) dengan penekanan TSH, di bawah 0,1 uU/L. Pada hipertiroid, TSH tertekan karena umpan balik negatif hormon tiroid terhadap hipofisis."},
{t:"C1-C2",s:"Pada hipotiroidisme primer, pola laboratorium yang paling khas adalah...",o:["TSH tinggi dengan fT4 rendah","TSH rendah dengan fT4 tinggi","T4 dan TSH sama-sama rendah","TSH tinggi dengan fT4 tinggi","TSH normal dengan fT4 normal"],w:["TSH rendah dengan fT4 tinggi adalah pola hipertiroidisme.","T4 dan TSH sama-sama rendah adalah pola hipotiroid sekunder atau sentral, karena kelainan ada di hipofisis atau hipotalamus.","TSH tinggi dengan fT4 tinggi tidak sesuai hipotiroidisme; pola ini dapat terjadi pada resistensi hormon tiroid.","TSH normal dengan fT4 normal menunjukkan fungsi tiroid normal."],e:"Pada hipotiroidisme primer, kelenjar tiroid tidak mampu memproduksi hormon yang cukup, sehingga fT4 turun dan TSH naik karena hipofisis meningkatkan sekresinya. Pola ini paling sering dijumpai dalam diagnosis hipotiroid."},
{t:"C1-C2",s:"Penyebab tirotoksikosis yang paling sering ditemukan adalah...",o:["Penyakit Graves (goiter difus toksik)","Adenoma toksik","Goiter multinodular toksik","Tiroiditis subakut","Struma ovarii"],w:["Adenoma toksik adalah penyebab hipertiroid yang lebih sering pada usia muda, tetapi jarang dibanding Graves.","Goiter multinodular toksik umumnya terjadi pada usia di atas 40 tahun dengan goiter lama, dan jumlahnya lebih sedikit dibanding Graves.","Tiroiditis subakut bersifat sementara dan menyebabkan tirotoksikosis akibat kebocoran hormon, bukan penyebab tersering.","Struma ovarii adalah penyebab yang sangat jarang berupa tumor ovarium penghasil hormon tiroid."],e:"Graves merupakan penyebab tirotoksikosis paling sering, sekitar 50-80% kasus. Penyakit ini bersifat autoimun dengan antibodi yang merangsang reseptor TSH, sehingga kelenjar tiroid membesar dan memproduksi hormon berlebihan."},
{t:"C1-C2",s:"Antibodi yang paling penting pada penyakit Graves adalah...",o:["Thyroid stimulating immunoglobulin (TSI)","Antibodi anti-tiroglobulin","Antibodi anti-kalsitonin","Antibodi anti-PTH","Antibodi anti-insulin"],w:["Antibodi anti-tiroglobulin ditemukan pada tiroiditis autoimun dan tidak merangsang reseptor TSH.","Antibodi anti-kalsitonin berkaitan dengan karsinoma tiroid medularis, bukan Graves.","Antibodi anti-PTH berkaitan dengan gangguan paratiroid, bukan Graves.","Antibodi anti-insulin berkaitan dengan DM tipe 1, bukan hipertiroid."],e:"TSI adalah antibodi yang paling penting pada Graves. TSI berikatan dengan reseptor TSH sebagai agonis, sehingga merangsang sintesis, pelepasan, dan pertumbuhan sel folikel tiroid. Akibatnya terjadi goiter difus dengan RAIU dan T3 dan T4 yang tinggi."},
{t:"C1-C2",s:"Rasio perempuan dengan laki-laki pada penyakit Graves adalah sekitar...",o:["5-10 : 1","1 : 1","1 : 2","2 : 1","1 : 20"],w:["Rasio 1 : 1 tidak sesuai, karena Graves jauh lebih sering pada perempuan.","Rasio 1 : 2 justru menunjukkan laki-laki lebih banyak, berlawanan dengan data.","Rasio 2 : 1 terlalu rendah untuk Graves dibanding rasio yang tercantum.","Rasio 1 : 20 terlalu tinggi dan tidak sesuai dengan data epidemiologi."],e:"Graves memiliki rasio perempuan dengan laki-laki sekitar 5-10 : 1. Untuk Plummer dan adenoma toksik rasionya sekitar 2-4 : 1. Puncak usia penyakit otoimun ini adalah 20-40 tahun."},
{t:"C1-C2",s:"Pada oftalmopati Graves, proptosis didefinisikan sebagai eksoftalmus lebih dari...",o:["22 mm","15 mm","18 mm","26 mm","30 mm"],w:["15 mm berada dalam batas normal dan belum termasuk proptosis.","18 mm masih di bawah ambang proptosis yang tercantum dalam pedoman.","26 mm melampaui ambang, tetapi bukan batas definisi yang dipakai pada pedoman ini.","30 mm adalah proptosis berat, bukan ambang definisi."],e:"Proptosis didefinisikan sebagai eksoftalmus lebih dari 22 mm, diukur dengan exophthalmometer Hertel. Oftalmopati Graves terjadi pada sekitar 50% pasien dan berhubungan dengan peradangan otot ekstraokular, sering lebih berat pada perokok."},
{t:"C1-C2",s:"Obat pilihan utama untuk mengendalikan gejala simpatis (takikardia, tremor, palpitasi) pada hipertiroid adalah...",o:["Propranolol","Levotiroksin","Propiltiourasil (PTU)","Radioiodin","Amiodaron"],w:["Levotiroksin adalah hormon tiroid, yang justru memperburuk hipertiroid.","PTU adalah antitiroid yang menurunkan produksi hormon, tetapi tidak cepat mengendalikan gejala simpatis.","Radioiodin adalah terapi definitif yang bekerja lambat, bukan simtomatik.","Amiodaron mengandung yodium tinggi dan dapat memicu tirotoksikosis."],e:"Propranolol adalah beta-blocker pilihan utama untuk gejala simpatis karena mengurangi heart rate dan tremor. Pada krisis tiroid, propranolol juga menghambat konversi T4 menjadi T3. Obat ini sebaiknya digunakan sebagai pelengkap, bukan pengganti antitiroid."},
{t:"C1-C2",s:"Antitiroid yang dipilih pada kehamilan trimester pertama adalah...",o:["Propiltiourasil (PTU)","Metimazol","Karbimazol","Radioiodin","Lugol"],w:["Metimazol dihindari pada trimester pertama karena berkaitan dengan risiko teratogenik.","Karbimazol diubah menjadi metimazol di tubuh sehingga memiliki risiko yang sama.","Radioiodin dikontraindikasikan pada kehamilan karena dapat merusak tiroid janin.","Lugol tidak digunakan sebagai terapi jangka panjang karena hanya menghambat pelepasan hormon sementara."],e:"PTU dipilih pada trimester pertama kehamilan. Slide mencatat bahwa PTU dosis 200 mg tidak memberikan dampak buruk pada janin, sedangkan hipotiroidisme janin harus dihindari karena tiroksin dan TSAb melewati plasenta."},
{t:"C1-C2",s:"Efek samping serius antitiroid yang harus dipantau sejak awal pengobatan adalah...",o:["Agranulositosis","Hipotiroid permanen","Hipoglikemia","Hiperkalemia","Gagal ginjal akut"],w:["Hipotiroid permanen adalah komplikasi terapi radioiodin atau tiroidektomi, bukan efek samping utama antitiroid.","Hipoglikemia tidak termasuk efek samping khas antitiroid.","Hiperkalemia tidak termasuk efek samping khas antitiroid.","Gagal ginjal akut tidak termasuk efek samping khas antitiroid."],e:"Agranulositosis adalah efek samping serius antitiroid yang dapat terjadi dalam beberapa minggu pertama. Pasien perlu diedukasi untuk segera melapor bila muncul demam atau sakit tenggorokan, dan dilakukan pemeriksaan hitung leukosit bila dicurigai."},
{t:"C1-C2",s:"Indikasi terapi radioiodin (I-131) pada penyakit Graves yang paling tepat adalah...",o:["Kekambuhan setelah tiroidektomi","Goiter kecil dengan gejala ringan pada anak","Wanita hamil trimester pertama","Pasien dengan gejala ringan yang baru terdiagnosis","Tirotoksikosis sementara akibat tiroiditis"],w:["Goiter kecil dengan gejala ringan pada anak sebaiknya ditangani dengan antitiroid, karena radioiodin tidak dianjurkan pada anak.","Wanita hamil trimester pertama adalah kontraindikasi radioiodin karena dapat merusak tiroid janin.","Pasien dengan gejala ringan yang baru terdiagnosis biasanya cukup dengan antitiroid sebagai terapi awal.","Tiroiditis bersifat sementara sehingga tidak memerlukan radioiodin."],e:"Radioiodin paling efektif untuk kekambuhan setelah tiroidektomi, pasien usia di atas 45 tahun, goiter besar, penyakit berat yang tidak terkontrol, dan pasien dengan kepatuhan rendah. Komplikasi utamanya adalah hipotiroid, yang relatif mudah dikendalikan."},
{t:"C1-C2",s:"Komplikasi yang paling sering dan paling penting dari terapi radioiodin adalah...",o:["Hipotiroid permanen","Krisis tiroid","Perdarahan","Paralisis pita suara","Malignansi yang terbukti"],w:["Krisis tiroid tidak termasuk komplikasi utama radioiodin; krisis dapat terjadi akibat pemicu lain.","Perdarahan merupakan komplikasi tiroidektomi, bukan radioiodin.","Paralisis pita suara merupakan komplikasi bedah tiroid akibat kerusakan nervus laringeus rekuren.","Malignansi belum terbukti pada terapi radioiodin, sehingga tidak termasuk komplikasi yang terbukti."],e:"Komplikasi utama radioiodin adalah hipotiroid, baik sementara maupun permanen. Sekitar 50% pasien menjadi hipotiroid pasca radiasi. Kemungkinan terjadinya malignansi disebutkan sebagai risiko yang belum terbukti."},
{t:"C1-C2",s:"Tiroiditis subakut (de Quervain) klasik ditandai oleh...",o:["Nyeri tiroid yang menjalar ke telinga atau rahang, demam, dan malaise","Tiroid tanpa nyeri dengan oftalmopati","Nodul dingin dengan RAIU tinggi","Proptosis bilateral tanpa tirotoksikosis","Benjolan keras seperti batu yang tidak ikut menelan"],w:["Tiroid tanpa nyeri dengan oftalmopati mengarah ke Graves, bukan tiroiditis subakut.","Nodul dingin dengan RAIU tinggi adalah pola yang bertentangan; nodul dingin memiliki RAIU rendah.","Proptosis bilateral tanpa tirotoksikosis menunjukkan oftalmopati, bukan tiroiditis subakut.","Benjolan keras seperti batu yang tidak ikut menelan adalah ciri tiroiditis Riedel."],e:"Tiroiditis subakut ditandai nyeri tiroid yang dapat menjalar ke leher depan, telinga, rahang, dan tenggorokan, disertai demam, malaise, dan anoreksia selama 2-6 minggu. Kelenjar teraba membesar difus dan nyeri tekan. Hipertiroid yang terjadi bersifat sementara akibat kebocoran hormon."},
{t:"C1-C2",s:"Trias krisis tiroid (thyroid storm) yang harus dicurigai adalah...",o:["Hipertermia, penurunan kesadaran, dan gejala toksikosis yang memburuk","Hipotermia, bradikardia, dan koma","Hipertensi, nyeri dada, dan sesak","Diare, poliuria, dan hipoglikemia","Hiperglikemia, ketoasidosis, dan kejang"],w:["Hipotermia, bradikardia, dan koma adalah gambaran krisis hipotiroid atau myxedema coma, bukan krisis tiroid.","Hipertensi, nyeri dada, dan sesak mengarah ke penyakit jantung, bukan trias krisis tiroid.","Diare dan poliuria dapat menyertai tirotoksikosis, tetapi bukan trias krisis tiroid.","Hiperglikemia dan ketoasidosis mengarah ke DM dekompensasi, bukan trias krisis tiroid."],e:"Krisis tiroid dicurigai bila terdapat trias hipertermia, penurunan kesadaran, dan memburuknya tanda toksikosis. Kondisi ini bisa dipicu infeksi, stres, atau tindakan bedah, dengan mortalitas 10-75% bila tidak segera ditangani."},
{t:"C1-C2",s:"Asupan yodium harian minimal yang dianjurkan untuk dewasa adalah...",o:["150 mcg","50 mcg","220 mcg","290 mcg","500 mcg"],w:["50 mcg terlalu rendah dan tidak sesuai dengan kebutuhan minimal dewasa.","220 mcg adalah kebutuhan ibu hamil, bukan dewasa umum.","290 mcg adalah kebutuhan ibu menyusui, bukan dewasa umum.","500 mcg melampaui kebutuhan dan dapat menjadi berlebihan; asupan berlebih harus dihindari."],e:"Kebutuhan yodium minimal harian adalah 150 mcg untuk dewasa, 220 mcg untuk ibu hamil, dan 290 mcg untuk ibu menyusui. Asupan berlebihan juga harus dihindari karena dapat memicu tirotoksikosis yang diinduksi yodium pada pasien dengan goiter."},
{t:"C1-C2",s:"Struma diffusa multipel nontoksik paling sering disebabkan oleh...",o:["Tiroiditis Hashimoto","Penyakit Plummer","Penyakit Graves","Adenoma toksik","Karsinoma folikular"],w:["Penyakit Plummer adalah goiter multinodular toksik, bukan struma difus nontoksik.","Penyakit Graves menyebabkan struma difus toksik, bukan nontoksik.","Adenoma toksik adalah nodul toksik tunggal yang menyebabkan tirotoksikosis.","Karsinoma folikular adalah keganasan yang biasanya membentuk nodul, bukan struma difus multipel."],e:"Pada pendekatan struma, struma diffusa multipel nontoksik disebabkan antara lain oleh Hashimoto, dishormogenesis, iatrogenik, dan obat antitiroid. Hashimoto merupakan tiroiditis autoimun kronis yang paling sering menjadi penyebab hipotiroid didapat."},
{t:"C3-C4",s:"Wanita 32 tahun dengan palpitasi, penurunan berat badan meski nafsu makan meningkat, berkeringat berlebihan, dan tidak tahan panas. Pemeriksaan: goiter difus, eksoftalmus, takikardia 110/menit, tremor halus. Laboratorium: fT4 tinggi, TSH <0,01 uU/L. Diagnosis dan terapi awal yang paling tepat adalah...",o:["Graves; antitiroid (metimazol atau PTU) dan propranolol","Tiroiditis subakut; observasi tanpa obat","Goiter multinodular toksik; tiroidektomi segera","Hipotiroid; levotiroksin dosis tinggi","Tirotoksikosis faktisia; hentikan suplemen saja"],w:["Tiroiditis subakut tidak disertai goiter difus dengan eksoftalmus, dan biasanya terdapat nyeri tiroid.","Goiter multinodular toksik tidak memiliki eksoftalmus khas, dan tiroidektomi tidak dilakukan sebagai langkah pertama.","Hipotiroid tidak sesuai dengan fT4 tinggi dan TSH tersupresi; levotiroksin akan memperburuk kondisi.","Tirotoksikosis faktisia memerlukan riwayat konsumsi hormon tiroid, yang tidak disebutkan dalam kasus."],e:"Gambaran goiter difus, eksoftalmus, fT4 tinggi, dan TSH tersupresi mengarah ke Graves. Terapi awal berupa antitiroid (metimazol atau PTU) selama 1-1,5 tahun, dengan propranolol untuk mengendalikan gejala simpatis. Radioiodin atau tiroidektomi dipertimbangkan bila terapi antitiroid gagal atau kambuh."},
{t:"C3-C4",s:"Pasien 45 tahun dengan Graves tidak diobati datang dengan demam 40 °C, delirium, takikardia 150/menit, dan diare berat setelah pneumonia. Skor Burch-Wartofsky diperkirakan sekitar 85. Tindakan awal yang paling tepat adalah...",o:["Rehidrasi, PTU dosis muat 600-1000 mg, Lugol setelah PTU, propranolol, hidrokortison, dan asetaminofen","Aspirin untuk menurunkan demam dan menunda antitiroid sampai hasil laboratorium","Tiroidektomi emergensi tanpa stabilisasi","Antibiotik saja tanpa terapi tiroid","Diuretik untuk mengatasi takikardia"],w:["Aspirin melepaskan hormon tiroid dari ikatan protein sehingga memperburuk tirotoksikosis; antitiroid tidak boleh ditunda.","Tiroidektomi emergensi tidak dilakukan sebelum pasien stabil; operasi dikerjakan setelah eutiroid.","Antibiotik untuk infeksi penting, tetapi tidak cukup tanpa mengoreksi tirotoksikosis dan faktor kardiovaskular.","Diuretik tidak mengatasi penyebab takikardia pada tirotoksikosis; beta-blocker lebih tepat."],e:"Skor Burch-Wartofsky di atas 45 sangat mendukung krisis tiroid. Penanganan meliputi rehidrasi, blok sintesis hormon dengan PTU dosis muat 600-1000 mg, blok pelepasan dengan Lugol, hambat konversi T4 ke T3 dengan propranolol, hidrokortison dosis stres, dan asetaminofen sebagai antipiretik. Pemicu seperti pneumonia juga harus diobati."},
{t:"C3-C4",s:"Pasien 50 tahun dengan dugaan hipertiroid memiliki skor indeks Wayne sebesar 22. Interpretasi yang tepat adalah...",o:["Hipertiroid (skor lebih dari 20)","Meragukan (skor 10-19)","Eutiroid (skor kurang dari 10)","Hipotiroid subklinis","Nodul toksik tunggal"],w:["Skor 10-19 termasuk kategori meragukan, sehingga tidak sesuai dengan skor 22.","Skor kurang dari 10 menunjukkan tidak ada hipertiroid, sehingga tidak sesuai.","Hipotiroid subklinis ditegakkan dari TSH tinggi dan T4 normal, bukan dari indeks Wayne.","Nodul toksik tunggal adalah etiologi, yang ditegakkan dengan scan dan USG, bukan dari skor klinis Wayne."],e:"Indeks Wayne lebih dari 20 menunjukkan hipertiroid, 10-19 meragukan, dan kurang dari 10 tidak ada hipertiroid. Indeks ini membantu kecurigaan klinis, sedangkan diagnosis pasti memerlukan pemeriksaan fT4 dan TSH serta uji penangkapan yodium."},
{t:"C3-C4",s:"Indikasi tiroidektomi pada penyakit Graves yang paling tepat adalah...",o:["Goiter besar dengan gejala penekanan trakea atau esofagus","Gejala ringan pada pasien yang baru terdiagnosis","Pasien hamil trimester pertama","Eksoftalmus ringan tanpa gangguan penglihatan","Pasien yang sudah eutiroid dengan antitiroid"],w:["Gejala ringan pada pasien baru biasanya ditangani dengan antitiroid, bukan operasi.","Pasien hamil trimester pertama dihindari dari tiroidektomi dan radioiodin; antitiroid dipilih.","Eksoftalmus ringan tanpa gangguan penglihatan ditangani secara konservatif, bukan dengan operasi.","Pasien yang sudah eutiroid tidak memerlukan operasi, selama remisi tercapai dengan antitiroid."],e:"Tiroidektomi dipilih pada goiter besar dengan penekanan, pasien yang memilih operasi, atau kekambuhan setelah antitiroid. Operasi dikerjakan setelah pasien eutiroid. Komplikasi yang perlu diingat meliputi hipotiroid, hipoparatiroid, dan kerusakan nervus laringeus rekuren."},
{t:"C3-C4",s:"Pasien Graves dengan proptosis 24 mm, diplopia, dan penurunan visus. Tatalaksana yang paling mendesak adalah...",o:["Kortikosteroid intravena dosis tinggi dan rujukan mata segera","Tiroidektomi segera tanpa pemeriksaan mata","Radioiodin dosis tinggi sebagai satu-satunya terapi","Observasi karena oftalmopati akan membaik sendiri","Pemeriksaan TSH ulang tanpa tindakan"],w:["Tiroidektomi tidak mengatasi oftalmopati aktif dan tidak boleh dilakukan tanpa evaluasi mata.","Radioiodin dapat memperburuk oftalmopati aktif, sehingga bukan satu-satunya terapi.","Observasi tidak tepat karena penurunan visus menunjukkan kompresi nervus optikus yang memerlukan penanganan segera.","Pemeriksaan TSH saja tidak menangani ancaman penglihatan."],e:"Penurunan visus pada oftalmopati Graves menunjukkan kompresi nervus optikus, yaitu kondisi darurat. Penanganan meliputi kortikosteroid intravena dosis tinggi dan rujukan segera ke dokter mata. Berhenti merokok juga penting karena merokok memperberat oftalmopati."},
{t:"C3-C4",s:"Wanita 28 tahun dengan Graves dan kehamilan 8 minggu. Terapi yang paling tepat dan pemantauan janin adalah...",o:["PTU dosis rendah (sekitar 200 mg) dan pemantauan denyut jantung janin","Radioiodin untuk menghentikan produksi hormon","Metimazol dosis tinggi sepanjang kehamilan","Tiroidektomi pada trimester pertama","Penghentian obat dan pemantauan tanpa terapi"],w:["Radioiodin dikontraindikasikan pada kehamilan karena merusak tiroid janin.","Metimazol dosis tinggi berisiko teratogenik, terutama pada trimester pertama.","Tiroidektomi pada trimester pertama tidak dianjurkan kecuali terdapat indikasi yang sangat kuat.","Penghentian terapi tanpa pengobatan berisiko memicu tirotoksikosis pada ibu dan janin."],e:"Pada kehamilan, PTU dosis rendah (sekitar 200 mg) dipilih karena tidak berdampak buruk pada janin. Hormon tiroid dan TSAb melewati plasenta, sehingga hipotiroid janin perlu dihindari. Denyut jantung janin di atas 150/menit menunjukkan hipertiroid janin, sedangkan di bawah 120/menit menunjukkan hipotiroid janin."},
{t:"C3-C4",s:"Wanita 40 tahun dengan tiroid nyeri tekan selama 3 minggu yang menjalar ke telinga, demam ringan, malaise, dan LED tinggi. Tirotoksikosis ringan dengan RAIU rendah. Diagnosis dan terapi yang paling tepat adalah...",o:["Tiroiditis subakut; OAINS atau kortikosteroid untuk nyeri, beta-blocker untuk gejala, antitiroid tidak diindikasikan","Penyakit Graves; antitiroid dosis tinggi","Goiter multinodular toksik; radioiodin","Tiroiditis Riedel; tiroidektomi","Tirotoksikosis iatrogenik; hentikan obat tiroid"],w:["Graves memiliki RAIU tinggi dan biasanya tidak disertai nyeri tiroid; antitiroid dosis tinggi tidak sesuai.","Goiter multinodular toksik tidak disertai nyeri tiroid dan memiliki RAIU tinggi atau distribusi nodular.","Tiroiditis Riedel bersifat tidak nyeri, keras, dan progresif, sehingga tidak sesuai dengan nyeri pada kasus ini.","Tirotoksikosis iatrogenik memerlukan riwayat konsumsi hormon tiroid, yang tidak ada dalam kasus."],e:"Nyeri tiroid yang menjalar, demam, malaise, LED tinggi, dan RAIU rendah khas tiroiditis subakut. Tirotoksikosis bersifat sementara karena kebocoran hormon, sehingga antitiroid tidak diindikasikan. Terapi meliputi OAINS atau kortikosteroid untuk nyeri, dan beta-blocker untuk gejala simpatis."},
{t:"C3-C4",s:"Wanita 30 tahun, 3 bulan pascapersalinan, mengeluh palpitasi dan penurunan berat badan. Empat minggu kemudian ia merasa lemas dan berat badan naik. Diagnosis yang paling mungkin adalah...",o:["Tiroiditis pascapersalinan, fase tirotoksik lalu fase hipotiroid sementara","Graves yang baru muncul setelah persalinan","Hipotiroid primer permanen sejak awal","Tiroiditis Riedel","Adenoma hipofisis penghasil TSH"],w:["Graves biasanya tidak mengikuti pola hipertiroid lalu hipotiroid sementara dalam beberapa bulan.","Hipotiroid primer permanen sejak awal tidak sesuai dengan fase tirotoksik yang mendahului.","Tiroiditis Riedel bersifat progresif dan keras, tidak sesuai pola dinamis ini.","Adenoma hipofisis penghasil TSH menyebabkan hipertiroid dengan TSH tinggi, dan jarang; pola dua fase tidak khas untuk itu."],e:"Tiroiditis pascapersalinan muncul sebagai hipertiroid 1-4 bulan setelah persalinan, diikuti hipotiroid sementara selama 2-8 minggu, lalu eutiroid. Sebagian kecil berkembang menjadi hipotiroid menetap, sehingga pemantauan fungsi tiroid diperlukan."},
{t:"C3-C4",s:"Wanita 55 tahun dengan kelelahan, kulit kering, konstipasi, bradikardia, dan refleks tendon lambat. TSH 35 uU/L dengan fT4 rendah. Terapi awal yang tepat adalah...",o:["Levotiroksin dengan dosis awal sekitar 50 mcg, dinaikkan bertahap setiap 4-6 minggu menuju sekitar 1,6 mcg/kgBB","Levotiroksin 500 mcg sekaligus","Antitiroid untuk menurunkan TSH","Radioiodin untuk merangsang fungsi tiroid","Observasi tanpa terapi karena kadar TSH hanya sedikit tinggi"],w:["Levotiroksin 500 mcg sekaligus berisiko memicu angina, aritmia, dan krisis jantung pada pasien usia lanjut.","Antitiroid bekerja menekan produksi hormon, sehingga memperburuk hipotiroid.","Radioiodin menghancurkan jaringan tiroid dan tidak merangsang fungsi tiroid.","TSH 35 uU/L termasuk peningkatan bermakna dan memerlukan terapi; observasi tidak cukup."],e:"Hipotiroid primer dengan TSH tinggi dan fT4 rendah memerlukan levotiroksin sebagai terapi substitusi. Dosis rata-rata sekitar 1,6 mcg/kgBB per hari, dimulai rendah pada pasien usia lanjut, lalu dinaikkan bertahap tiap 4-6 minggu. Target TSH normal dipantau setiap 1-2 bulan."},
{t:"C3-C4",s:"Pasien hipotiroid berusia 65 tahun dengan angina pektoris stabil mulai mendapat levotiroksin. Pendekatan yang paling aman adalah...",o:["Mulai dosis rendah dan titrasi perlahan dengan pemantauan gejala jantung","Mulai dosis penuh 1,6 mcg/kgBB pada hari pertama","Hentikan levotiroksin karena pasien memiliki angina","Berikan levotiroksin malam hari dengan dosis tinggi","Berikan antitiroid bersamaan untuk menyeimbangkan hormon"],w:["Dosis penuh sejak awal berisiko memicu angina atau aritmia pada pasien dengan penyakit jantung.","Menghentikan levotiroksin membiarkan hipotiroid memburuk; angina bukan kontraindikasi absolut bila dosis disesuaikan.","Pemberian malam hari dengan dosis tinggi tidak dianjurkan; levotiroksin diminum pagi hari saat perut kosong.","Antitiroid tidak diindikasikan pada hipotiroid primer dan justru memperburuk kondisi."],e:"Pada hipotiroid dengan penyakit jantung, prinsip terapi substitusi adalah dosis awal yang rendah dan kenaikan yang landai. Angina, gagal jantung, atau gangguan irama harus diwaspadai karena peningkatan metabolisme dapat memperberat beban jantung. Levotiroksin diberikan pagi hari saat perut kosong."},
{t:"C3-C4",s:"Pasien 35 tahun dengan nodul tiroid soliter 2,5 cm, TSH normal, dan sidik tiroid menunjukkan nodul dingin. Pemeriksaan lanjutan yang paling tepat adalah...",o:["Biopsi aspirasi jarum halus (FNA) dengan bimbingan USG","Sidik tiroid ulang dengan I-131 dosis tinggi","Terapi I-131 untuk mengecilkan nodul","Terapi levotiroksin supresi tanpa pemeriksaan lain","Observasi tanpa pemeriksaan lanjutan"],w:["Sidik ulang tidak menentukan keganasan; nodul dingin justru memerlukan sitologi untuk memastikan jenisnya.","Terapi I-131 tidak dianjurkan pada nodul dingin karena tidak menangkap yodium, sehingga tidak efektif.","Levotiroksin supresi tidak dianjurkan sebelum keganasan disingkirkan, karena nodul dingin berisiko ganas.","Observasi tanpa pemeriksaan tidak tepat karena nodul dingin memiliki risiko keganasan yang perlu disingkirkan."],e:"Nodul dingin memiliki penangkapan yodium lebih rendah daripada jaringan sekitarnya dan berisiko keganasan. FNA dengan jarum 22-27 gauge di bawah bimbingan USG aman, dilakukan di poliklinik, dan membantu menentukan langkah selanjutnya."},
{t:"C3-C4",s:"Pria 58 tahun dengan goiter multinodular, TSH tersupresi, dan sidik tiroid menunjukkan beberapa nodul panas (penangkapan yodium lebih banyak dari sekitarnya) dengan supresi jaringan tiroid lain. Diagnosis dan pilihan terapi yang tepat adalah...",o:["Goiter multinodular toksik (Plummer); radioiodin atau tiroidektomi","Graves; antitiroid saja","Tiroiditis subakut; OAINS saja","Karsinoma tiroid anaplastik; kemoterapi","Hipotiroid primer; levotiroksin"],w:["Graves memiliki distribusi difus dan RAIU tinggi merata, bukan nodul panas multipel.","Tiroiditis subakut memiliki RAIU rendah dan nyeri tiroid, bukan nodul panas.","Karsinoma tiroid anaplastik jarang, cepat tumbuh, dan biasanya tidak menghasilkan nodul panas.","Hipotiroid primer tidak disertai TSH tersupresi, sehingga tidak sesuai kasus ini."],e:"Nodul panas multipel dengan TSH tersupresi mengarah ke goiter multinodular toksik (Plummer), yang sering terjadi pada usia di atas 40 tahun dengan goiter lama. Pilihan terapi meliputi radioiodin atau tiroidektomi, serta antitiroid sebagai persiapan. Nodul panas jarang ganas."},
{t:"C3-C4",s:"Wanita 35 tahun yang sedang menurunkan berat badan dengan pil pelangsing mengalami palpitasi dan tremor. Pemeriksaan: fT4 tinggi, TSH tertekan, RAIU rendah, dan tiroglobulin rendah. Diagnosis yang paling mungkin adalah...",o:["Tirotoksikosis faktisia akibat hormon tiroid eksogen","Graves","Adenoma toksik","Struma ovarii","Tiroiditis subakut"],w:["Graves memiliki RAIU tinggi, bukan rendah, dan tiroglobulin tidak rendah.","Adenoma toksik memiliki RAIU tinggi pada nodul yang aktif, bukan rendah merata.","Struma ovarii adalah tumor ovarium dengan jaringan tiroid, yang biasanya tidak menyebabkan RAIU rendah dengan tiroglobulin rendah pada pasien ini tanpa massa pelvis.","Tiroiditis subakut memiliki RAIU rendah, tetapi tidak berhubungan dengan konsumsi pil pelangsing dan biasanya disertai nyeri tiroid."],e:"Konsumsi hormon tiroid eksogen menyebabkan tirotoksikosis faktisia. Pemeriksaan khas menunjukkan RAIU rendah dan tiroglobulin rendah karena kelenjar tertekan oleh hormon eksogen. Riwayat konsumsi obat atau suplemen perlu digali secara aktif."},
{t:"C3-C4",s:"Pria 62 tahun dengan fibrilasi atrium yang mendapat amiodaron dan memiliki goiter multinodular di daerah defisiensi yodium, kini mengalami tirotoksikosis. Tipe amiodaron-induced thyrotoxicosis yang paling mungkin dan tatalaksana awalnya adalah...",o:["Tipe 1 (induksi yodium) pada goiter nodular; antitiroid dosis tinggi dan pemantauan ketat","Tipe 2 (destruktif) dengan kelenjar normal; propranolol saja","Tiroiditis Hashimoto; levotiroksin","Krisis tiroid tipe 1; tiroidektomi emergensi","Graves; radioiodin saja"],w:["Tipe 2 (destruktif) terjadi pada kelenjar yang sebelumnya normal, sehingga kurang sesuai dengan goiter nodular.","Propranolol saja tidak cukup untuk menghentikan produksi hormon yang berlebih pada tipe 1.","Tiroiditis Hashimoto memberi hipotiroid, bukan tirotoksikosis, sehingga levotiroksin tidak tepat.","Krisis tiroid tidak otomatis termasuk tipe 1; tiroidektomi emergensi tidak diindikasikan tanpa tanda krisis."],e:"Amiodaron mengandung sekitar 37% yodium. Tipe 1 terjadi akibat kelebihan yodium pada kelenjar yang sudah abnormal, seperti goiter nodular atau daerah defisiensi yodium, sehingga pengobatan berupa antitiroid dosis tinggi. Tipe 2 bersifat destruktif pada kelenjar normal dan dapat dikendalikan dengan kortikosteroid."},
{t:"C3-C4",s:"Pria 45 tahun dengan tumor hipofisis yang diterapi, kini mengeluh lemas dan berat badan naik. Pemeriksaan: TSH rendah atau normal dan fT4 rendah. Diagnosis yang paling mungkin dan pemantauan terapi yang tepat adalah...",o:["Hipotiroid sekunder (sentral); levotiroksin dengan pemantauan fT4 karena TSH tidak dapat dipakai","Hipotiroid primer; pemantauan TSH saja","Hipertiroid; antitiroid","Tiroiditis subakut; OAINS","Graves; radioiodin"],w:["Hipotiroid primer ditandai TSH tinggi, sedangkan pada kasus ini TSH rendah atau normal.","Pemantauan TSH saja tidak tepat pada hipotiroid sekunder, karena TSH tidak mencerminkan fungsi tiroid.","Hipertiroid ditandai fT4 tinggi, sedangkan pada kasus ini fT4 rendah.","Tiroiditis subakut ditandai nyeri tiroid dan tirotoksikosis sementara, tidak sesuai dengan gambaran ini."],e:"Hipotiroid sekunder atau sentral berasal dari kelainan hipofisis atau hipotalamus, sehingga TSH rendah atau normal dan fT4 rendah. Pemantauan terapi levotiroksin harus menggunakan fT4, karena TSH tidak dapat dijadikan patokan pada kondisi ini."}
];
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCDE";
let order=[],i=0,score=0,lv={};
function start(){
  order=sh(Q).map(q=>({q,o:sh(q.o.map((t,k)=>({t,c:k===0,r:k===0?"":q.w[k-1]})))}));
  i=0;score=0;lv={"C1-C2":[0,0],"C3-C4":[0,0]};show();
}
function show(){
  const app=document.getElementById('app');app.innerHTML='';
  if(i>=order.length){
    const c=$('div','card');
    c.append($('h3',null,'Hasil: '+score+' / '+order.length+' benar'));
    for(const k in lv)c.append($('p',null,k+': '+lv[k][0]+' / '+lv[k][1]+' benar'));
    const b=$('button','btn','Acak & Mulai Ulang');b.onclick=start;c.append(b);
    app.append(c);return;
  }
  const it=order[i];
  const pb=$('div','bar');const d=$('div');d.style.width=(i/order.length*100)+'%';pb.append(d);app.append(pb);
  const card=$('div','card');
  card.append($('p','tag','Soal '+(i+1)+' / '+order.length+'  ·  '+it.q.t));
  card.append($('p','stem',it.q.s));
  const btns=it.o.map((o,k)=>{
    const b=$('button','opt',L[k]+'. '+o.t);
    b.onclick=()=>pick(b,o,k);card.append(b);return b;
  });
  function pick(b,o,k){
    if(btns[0].disabled)return;
    btns.forEach(x=>x.disabled=true);
    lv[it.q.t][1]++;
    if(o.c){score++;lv[it.q.t][0]++;b.classList.add('ok');}
    else{b.classList.add('bad');btns[it.o.findIndex(x=>x.c)].classList.add('ok');}
    const ex=$('div','exp');
    const ci=it.o.findIndex(x=>x.c);
    ex.append($('p',null,'Jawaban benar: '+L[ci]+'. '+it.o[ci].t));
    ex.append($('p',null,it.q.e));
    ex.append($('h4',null,'Mengapa opsi lain tidak tepat:'));
    const ul=$('ul');
    it.o.forEach((x,j)=>{if(!x.c)ul.append($('li',null,L[j]+'. '+x.t+' → '+x.r));});
    ex.append(ul);
    card.append(ex);
    const nb=$('button','btn',i+1<order.length?'Soal Berikutnya':'Lihat Hasil');
    nb.onclick=()=>{i++;show();};card.append(nb);
  }
  app.append(card);
}
start();
</script>

</html>
